# ==========================================
# CONFIGURACOES DE PRODUCAO
# ==========================================

spring.application.name=agendamento

# ==========================================
# CONFIGURACOES DO BANCO DE DADOS PRODUCAO
# ==========================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/agendamento_prod}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ==========================================
# CONFIGURACOES DO JPA/HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# CONFIGURACOES DE PAGINACAO
# ==========================================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# ==========================================
# CONFIGURACOES DE SEGURANCA JWT
# ==========================================
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# CONFIGURACOES DO SERVIDOR
# ==========================================
server.port=${PORT:8080}

# ==========================================
# CONFIGURACOES DE LOGGING
# ==========================================
logging.level.org.springframework.web=INFO
logging.level.br.com.sasaki.solution.agendamento=INFO
logging.level.org.springframework.security=WARN

# ==========================================
# CONFIGURACOES DE MONITORAMENTO (PROD)
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.info.env.enabled=false