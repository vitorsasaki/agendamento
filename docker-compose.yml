version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agendamento-postgres
    environment:
      POSTGRES_DB: agendamento_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Vi1106@
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agendamento_dev"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    image: agendamento
    container_name: agendamento-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/agendamento_dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: